<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio IPUC - App Web Responsiva</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <aside id="menu-lateral">
        <div class="menu-header">
            <span class="material-icons menu-icon">public</span>
            <h2>Radio Apostólica EC</h2>
        </div>
        <nav class="menu-nav">
            <ul>
                <li class="active"><a href="#"><span class="material-icons">home</span>Inicio</a></li>
                <li><a href="#"><span class="material-icons">settings</span>Ajustes</a></li>
            </ul>
        </nav>
        <h3>Redes Sociales</h3>
        <ul class="social-links">
            <li><a href="https://ipuc.org.co/" target="_blank"><span class="material-icons">language</span>Sitio web</a></li>
            <li><a href="https://www.instagram.com/radioipucoficial" target="_blank"><i class="fab fa-instagram social-icon"></i>Instagram</a></li>
            <li><a href="https://twitter.com/radioipuc" target="_blank"><i class="fab fa-x-twitter social-icon"></i>Twitter</a></li>
            <li><a href="https://www.youtube.com/@radioipucoficial" target="_blank"><i class="fab fa-youtube social-icon"></i>YouTube</a></li>
        </ul>
        </aside>

    <main id="main-content">
        <button id="menu-toggle" class="menu-toggle">
            <span class="material-icons">menu</span>
        </button>

        <div class="radio-player">
            <div class="logo-container">
                <img src="img.png" alt="Logo Radio IPUC" class="radio-logo">
            </div>

            <h1 class="radio-name">Radio Apostólica EC</h1>
            <p class="radio-slogan">Un Señor, una fe, un bautismo</p>

            <div class="book-image"></div> 

            <div class="controls-container">
                <button class="control-btn"><span class="material-icons">alarm</span></button>

                <button id="play-pause-btn" class="main-control-btn">
                    <span class="material-icons">play_arrow</span>
                </button>

                <button class="control-btn"><span class="material-icons">volume_up</span></button>
            </div>
            
            <audio id="radio-stream" preload="none"></audio>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
